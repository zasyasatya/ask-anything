# Ask Anything — satu service, satu direktori data di DISK SERVER.
#
#   sudo mkdir -p /opt/ask-anything/data
#   sudo chown -R 1000:1000 /opt/ask-anything/data     # container jalan sbg uid 1000
#   ASK_DATA_HOST_DIR=/opt/ask-anything/data docker compose up -d --build
#   docker compose logs -f
#
# Seluruh state (SQLite + artifact + arsip RAG + model offline + backup) tinggal
# di direktori host `${ASK_DATA_HOST_DIR}` yang di-bind mount ke /app/data.
# Bind mount dipilih (bukan named volume) supaya datanya bisa dilihat, di-backup
# dan di-rsync langsung dari server — `docker compose down`, `up --build`, docker
# prune, bahkan menghapus resource-nya TIDAK menyentuh direktori itu.
#
# Entrypoint menolak start bila /app/data ternyata bukan mount point, jadi salah
# konfigurasi ketahuan di log deploy — bukan setelah data hilang.
#
# Coolify: panduan lengkap di docs/DEPLOY-COOLIFY.md §5 (Storages → Directory
# Mount). File ini untuk uji lokal VPS / Portainer / server tanpa Coolify.

services:
  ask-anything:
    build:
      context: .
      dockerfile: Dockerfile
    image: ask-anything:latest
    container_name: ask-anything
    restart: unless-stopped
    # uid:gid pemilik direktori data di host (lihat chown di atas).
    user: "1000:1000"
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # ---- WAJIB diisi untuk produksi (lihat .env.example) ----
      ASK_PROVIDER: ${ASK_PROVIDER:-mock}
      ASK_OPENAI_API_KEY: ${ASK_OPENAI_API_KEY:-}
      ASK_OPENAI_MODEL: ${ASK_OPENAI_MODEL:-gpt-4o-mini}
      ASK_OPENAI_BASE_URL: ${ASK_OPENAI_BASE_URL:-https://api.openai.com/v1}
      # ---- Login (jangan biarkan default di server publik!) ----
      ASK_AUTH_MODE: ${ASK_AUTH_MODE:-required}
      ASK_ADMIN_PASSWORD: ${ASK_ADMIN_PASSWORD:-}
      # ---- Akun anak internship (password kosong = digenerate sekali) ----
      ASK_INTERN_USERNAME: ${ASK_INTERN_USERNAME:-verisimb}
      ASK_INTERN_EMAIL: ${ASK_INTERN_EMAIL:-verisimb@gmail.com}
      ASK_INTERN_NAME: ${ASK_INTERN_NAME:-Very Irawan Simbolon}
      ASK_INTERN_PASSWORD: ${ASK_INTERN_PASSWORD:-}
      # ---- Persistence: satu direktori untuk semua state ----
      # Semua path turunan (db/artifacts/rag/models/backups) mengikuti ini,
      # jadi JANGAN diubah kecuali mount di bawah ikut diubah.
      ASK_DATA_DIR: /app/data
    volumes:
      # kiri = direktori DI DISK SERVER, kanan = di dalam container.
      - ${ASK_DATA_HOST_DIR:-./data-server}:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
